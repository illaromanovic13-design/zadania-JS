&lt;div style="color:navy;font-size:50px;"&gt;
&lt;script type="text/javascript"&gt;
// Illia Romanovych nr 21  19.11.2026
// Zadanie 18

var a=parseFloat(prompt("a=",""));
var b=parseFloat(prompt("b=",""));

function suma_rom(a, b) {
    return a + b;
}
function odejmowanie_rom(a, b) {
    return a - b;
}
function mnozenie_rom(a, b) {
    return a * b;
}
function od_kwadratu_rom(a, b) {
    return a + "^2 = " + (a * a) + "&lt;br&gt;" + b + "^2 = " + (b * b);
}
function reszta_z_dzielenia_a_przez_b_rom(a, b) {
    return a % b;
}

document.write("suma=" + suma_rom(a, b) + "&lt;br&gt;");
document.write("różnica=" + odejmowanie_rom(a, b) + "&lt;br&gt;");
document.write("iloczyn=" + mnozenie_rom(a, b) + "&lt;br&gt;");
document.write(od_kwadratu_rom(a, b) + "&lt;br&gt;");
document.write("reszta z dzielenia a przez b=" + reszta_z_dzielenia_a_przez_b_rom(a, b) + "&lt;br&gt;");
&lt;/script&gt;
