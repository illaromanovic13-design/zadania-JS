// długość drabiny z twierdzenia Pitagorasa: l = sqrt(d^2 + x^2)
function dlugosc_drabiny_rom(d, x)
{
  return Math.sqrt(d * d + x * x);
}
// kąt nachylenia: alfa = arctg(d / x), zamiana radianów na stopnie
function kat_drabiny_rom(d, x)
{
  return Math.atan(d / x) * 180 / Math.PI;
}
function oblicz_drabine()
{
  var d = parseFloat(document.getElementById("d").value);
  var x = parseFloat(document.getElementById("x").value);
  document.getElementById("drabina").value = dlugosc_drabiny_rom(d, x).toFixed(2);
  document.getElementById("alfa").value = kat_drabiny_rom(d, x).toFixed(2);
}
</script>

<input type="button" value="oblicz" onclick="oblicz_drabine()"><br><br>
