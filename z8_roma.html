<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zadanie 8 - Confirm Box - Illia Romanovych</title>
</head>
<body>
<script type="text/javascript">
function show_confirm()
{
  var r = confirm("Naciśnij klawisz");
  if (r == true)
  { document.write("Nacisnąłeś OK!"); }
  else
  { document.write("Nacisnąłeś Cancel!"); }
}
</script>
<h3>Zadanie 8 - Confirm Box</h3>
<p><b>Zastosowanie:</b> Jest używany, jeśli chcemy zapytać użytkownika o weryfikację lub akceptację jakichś danych. Użytkownik musi nacisnąć "OK" w celu akceptacji bądź "Cancel" w celu odrzucenia. Jeżeli zostanie wybrane "OK", metoda zwraca true, w przeciwnym wypadku false.</p>
<input type="button" onclick="show_confirm()" value="Pokaż confirm box" />
<br><br>
<input type="button" value="zamknij okno" onclick="okno_zamknij_romanovych()"/>
<script type="text/javascript">
function okno_zamknij_romanovych()
{
  window.close()
}
</script>
</body>
</html>
