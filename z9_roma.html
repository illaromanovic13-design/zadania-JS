<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zadanie 9 - Prompt Box - Illia Romanovych</title>
</head>
<body>
<script type="text/javascript">
function show_prompt()
{
  var name = prompt("Napisz imię", "Imię Nazwisko");
  if (name != null && name != "")
  {
    document.write("Witaj " + name + "! jak się masz?");
  }
}
</script>
<h3>Zadanie 9 - Prompt Box</h3>
<p><b>Zastosowanie:</b> Jest używany, kiedy użytkownik ma wpisać coś, np. zanim wejdzie w dany moduł strony (np. hasło). Użytkownik po wpisaniu wartości może nacisnąć "OK" albo "Cancel". Jeżeli kliknie "OK", metoda zwraca wpisaną wartość, w przeciwnym wypadku zwraca null.</p>
<input type="button" onclick="show_prompt()" value="Pokaż prompt box" />
<br><br>
<input type="button" value="zamknij okno" onclick="okno_zamknij_romanovych()"/>
<script type="text/javascript">
function okno_zamknij_romanovych()
{
  window.close()
}
</script>
</body>
</html>
